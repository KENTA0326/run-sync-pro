# 8GB Mac 等でバックエンドの Docker 内ビルドが OOM になる場合に使用。
# 使い方:
#   1. ./scripts/build-backend.sh   # Mac 上でバイナリをビルド
#   2. docker-compose -f docker-compose.yml -f docker-compose.binary.yml up -d db backend frontend
#
# 注意: コードを変更したら 1 と 2 をやり直す（ホットリロードはありません）
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.binary
    volumes: []   # ソースのマウントをやめる（バイナリのみで動かす）
