services:
  db:
    image: postgres:15-alpine
    container_name: run-sync-db
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: run-sync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: run-sync-backend
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      # .env の POSTGRES_* から組み立て。DATABASE_URL を .env に書けばそちらが優先される
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&TimeZone=Asia/Tokyo"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./backend:/app
    tty: true
    stdin_open: true
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: run-sync-frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/src
      - /src/node_modules # これによりMac側の古い環境に左右されなくなります
    environment:
      - NODE_ENV=development

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: run-sync-swagger
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs:/spec

volumes:
  db-data:
  redis-data: