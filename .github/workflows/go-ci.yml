name: Go CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/go-ci.yml"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go test (race)
        run: go test -race -count=1 ./...

      - name: go vet
        run: go vet ./...

      - name: Struct tag check (binding / gorm)
        run: go run ./cmd/tagcheck .

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
          args: --timeout=3m
