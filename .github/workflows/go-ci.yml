name: Go CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/go-ci.yml"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: runsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d runsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/runsync_test?sslmode=disable&TimeZone=Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go test (race)
        run: go test -race -count=1 ./...

      - name: Migration reversibility (up / down / up)
        run: go test -count=1 -run TestMigrationsReversible ./database

      - name: go vet
        run: go vet ./...

      - name: Struct tag check (binding / gorm)
        run: go run ./cmd/tagcheck .

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
          args: --timeout=3m
